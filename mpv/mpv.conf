# mpv configuration for RIFE frame interpolation.

# A profile that turns on RIFE through the bundled VapourSynth script.
# Usage: mpv --config-dir=mpv --profile=rife video.mkv
[rife]
vf-add=@rife:vapoursynth=~~/../vapoursynth/rife.vpy
# RIFE raises the frame rate; let the display sync resample to it.
video-sync=display-resample

# Load the runtime toggle script (Ctrl+r enables/disables RIFE mid-playback).
scripts-append=~~/scripts/rife-toggle.lua
